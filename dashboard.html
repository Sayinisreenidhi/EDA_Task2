
<html>
<head>
<title>Superstore Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff9966, #ff5e62);
    text-align: center;
    padding-top: 30px;
}

.dashboard-box {
    width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background-color: #4CAF50;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border: 1px solid #ddd;
}

h1 {
    color: white;
}
</style>

</head>

<body>

<h1>📊 Superstore Dashboard</h1>

<div class="dashboard-box">
    <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: right;">
      <th>Category</th>
      <th>Sales</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Furniture</td>
      <td>11083.7797</td>
    </tr>
    <tr>
      <td>Office Supplies</td>
      <td>5233.9940</td>
    </tr>
    <tr>
      <td>Technology</td>
      <td>5186.7580</td>
    </tr>
  </tbody>
</table>
</div>

</body>
</html>
